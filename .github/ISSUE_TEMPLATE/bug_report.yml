name: 🐞 Something doesn't work
description: A card shows something wrong, does the wrong thing, or doesn't load.
title: "[Card] Short description of what goes wrong"
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Every home is different, and reports like this are what make the cards work in more of them.
        **Before you start:** if you came from the old per-card repositories (area-pulse-card, home-pulse-card…), remove their HACS downloads and dashboard resources first. While an old resource loads, it wins over Pulse Cards.

  - type: dropdown
    id: card
    attributes:
      label: Which card?
      multiple: true
      options:
        - Area Pulse Card
        - Home Pulse Card
        - Home Pulse Shortcuts
        - Tile Pulse Card
        - Scene Pulse Card
        - All of them / the bundle doesn't load
        - The visual editor of a card
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happens?
      description: What you see or what the card does. A screenshot or a short screen recording helps a lot. Please hide private names and addresses first.
      placeholder: "When I tap the lit house mode, nothing happens and the console shows an error."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
      placeholder: "The mode should go back to 'Normal' (my mode_default)."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How can I make it happen?
      description: The steps, starting from a dashboard with the card on it.
      placeholder: |
        1. Add the card with the YAML below
        2. Select the "Movie" mode
        3. Tap "Movie" again
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: The card's YAML
      description: From the card editor → ⋮ → "Show code editor". Rename entities if you like, but keep their domain (`light.`, `sensor.`, …).
      render: yaml

  - type: textarea
    id: entities
    attributes:
      label: The entities involved (optional)
      description: The domain and integration of the entities that misbehave, and their state and attributes from Developer tools → States. This is often the key in a bug that only happens in some homes.
      placeholder: "select.purifier_mode (Xiaomi Miio), options: Auto, Silent, Favorite. State: Silent"
      render: text

  - type: input
    id: version
    attributes:
      label: Pulse Cards version
      description: The browser console shows it as `PULSE-CARDS vX.Y.Z`, or see HACS.
      placeholder: "v1.1.0"
    validations:
      required: true

  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.1"
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: Browser or app, and device
      placeholder: "Chrome 141 on Windows / Companion app 2026.10 on Android, phone"
    validations:
      required: true

  - type: dropdown
    id: view
    attributes:
      label: Dashboard view type
      options:
        - Sections
        - Masonry
        - Panel
        - Sidebar
        - Not sure

  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options:
        - Home Assistant default (light)
        - Home Assistant default (dark)
        - Pulse, Pulse Glass or Pulse Tonal
        - Another theme

  - type: input
    id: language
    attributes:
      label: Home Assistant language (if not English)
      placeholder: "Greek"

  - type: textarea
    id: console
    attributes:
      label: Errors in the browser console (if any)
      description: F12 → Console. Copy the red lines and anything that mentions PULSE-CARDS.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Quick checks
      options:
        - label: I'm on the latest Pulse Cards release, and I reloaded the browser (cleared the cache, or reset the frontend cache in the companion app).
          required: true
        - label: No old per-card resource (area-pulse-card.js, home-pulse-card.js, tile-pulse-card.js, scene-pulse-card.js) is loaded any more.
        - label: I searched the open issues and this isn't reported yet.
          required: true
